# Build and test the engine, then the Python flow and evaluation code. No step asserts a latency number.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: cargo build --release --workspace
      - run: cargo test --release --workspace
      # The output hash was recorded on a Windows laptop and a Linux container. This runner is a third machine.
      - name: determinism against the committed hash
        run: python eval/determinism.py --check
      - name: fuzz smoke, two minutes against the Python reference
        run: cargo run --release -p fuzz -- --hours 0.033 --heartbeat-secs 30 --log fuzz-smoke.log && cat fuzz-smoke.log
      # Runs the harness end to end and checks the two single-thread runs agree. The numbers are printed, never asserted.
      - name: benchmark sanity
        run: cargo run --release -p bench -- --quick

  # TLC on the lifecycle and handoff model. Fails unless the real model passes and both planted bugs are caught.
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python spec/check.py
